name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=aegis_cloud --cov-report=term-missing --cov-fail-under=85
      - run: aegis demo --out runs/demo
      - run: aegis verify runs/demo
      - run: aegis benchmark --out runs/benchmark
      - run: python -m build
      - run: python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: synthetic-demo-and-wheel
          path: |
            runs/
            dist/
